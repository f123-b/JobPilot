[project]
name = "jobpilot"
version = "0.3.2"
description = "Multi-agent job search platform with Resume RAG, vector memory and persistent LangGraph checkpoints"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "openai>=1.50",
  "browser-use>=0.13",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "aiosqlite>=0.20",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pypdf>=5.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
